services:
  api:
    build: .
    container_name: timesheet-api

    restart: unless-stopped

    env_file:
      - .env.production

    depends_on:
      - mysql

    volumes:
      - ./uploads:/app/uploads

    labels:
      - "traefik.enable=true"

      # Unique Timesheet router
      - "traefik.http.routers.timesheet-api.rule=Host(`timesheet-api.dinnusmart.com`)"
      - "traefik.http.routers.timesheet-api.entrypoints=websecure"
      - "traefik.http.routers.timesheet-api.tls=true"
      - "traefik.http.routers.timesheet-api.tls.certresolver=letsencrypt"

      # Unique Timesheet service
      - "traefik.http.services.timesheet-api.loadbalancer.server.port=3000"

      # Tell Traefik to use the host network
      - "traefik.docker.network=host"

  mysql:
    image: mysql:8.4

    container_name: timesheet-mysql

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
